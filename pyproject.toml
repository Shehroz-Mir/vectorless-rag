[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorless-rag"
version = "0.1.0"
description = "Multi-user vectorless RAG over PDFs: PageIndex (local) + LangChain + OpenAI."
requires-python = ">=3.13"
# Versions verified by the spikes or checked on PyPI (spec Section 17).
dependencies = [
    "pageindex==0.2.20",
    "langchain==1.4.3",
    "langchain-core==1.6.5",
    "langchain-openai==1.6.6",
    "openai==2.54.0",  # 3.x conflicts with pageindex's dependencies
    "pymupdf==1.28.2",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",  # FastAPI file uploads
    "sqlalchemy==2.1.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",  # what starlette's TestClient uses
    "pyright==1.1.414",
    "pyyaml==6.0.3",  # evals/questions.yaml
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import the shared fakes as `tests.fakes`
filterwarnings = [
    # PageIndex depends on PyPDF2; the tests use it to check what PageIndex will read.
    "ignore:PyPDF2 is deprecated:DeprecationWarning",
    # LiteLLM (loaded by PageIndex) declares ReadOnly TypedDict items; pydantic notes it on import.
    "ignore:Items? .* using the `ReadOnly` qualifier:UserWarning",
]
